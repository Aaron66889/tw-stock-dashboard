name: Production strong-add B smoke probe
on:
  push:
    branches:
      - verify/trend-b-production-smoke-20261013
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live website HTML and API
        run: |
          node <<'NODE'
          const base = 'https://tw-stock-dashboard-5.onrender.com';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function get(path, timeout = 55000) {
            const r = await fetch(base + path, { signal: AbortSignal.timeout(timeout), headers: { Accept: '*/*' } });
            if (!r.ok) throw Error(path + ' HTTP ' + r.status);
            return r;
          }
          const health = await (await get('/api/health')).json();
          if (!health.ok) throw Error('health not ok: ' + JSON.stringify(health));
          console.log('HEALTH', JSON.stringify({ok:health.ok,build:health.build,status:health.status}));
          const html = await (await get('/')).text();
          for (const v of ['id="trendShadowB"', '/trend-shadow-b-ui.js', '/model-ab.js', 'id="trendForwardLedger"','/trend-forward-ui.js']) {
            if (!html.includes(v)) throw Error('HTML missing ' + v);
          }
          const script = await (await get('/trend-shadow-b-ui.js')).text();
          if (!script.includes('Shadow') || !script.includes('abPriceCore')) throw Error('frontend code not deployed');
          console.log('HTML and frontend script: PASS');

          // Model / Validation no longer fires expensive four-ETF history on page open.
          const modelUI=await(await get('/app.js')).text();
          if(modelUI.includes('window.CrashGateLabUI?.load(false)'))
            throw Error('Model page still eagerly starts all four historical crash backtests');
          if(!modelUI.includes("if(id==='model'){renderSpecs(true);loadValidation(false);"))
            throw Error('Lightweight validation no longer starts on visit');
          if(!modelUI.includes("GateBlockedUI?.load(false)"))
            throw Error('Gate-blocked summary not reachable');
          const validationStarted=Date.now();
          const validationResponse=await(await get('/api/validation',17000)).json();
          const validationMs=Date.now()-validationStarted;
          if(!validationResponse?.ok || !validationResponse.checks)
            throw Error('Light model validation failed: '+JSON.stringify(validationResponse).slice(0,400));
          const buyLatency=[];
          for(let i=0;i<3;i++){
            const t=Date.now(),d=await(await get('/api/buy-model',17000)).json();
            buyLatency.push(Date.now()-t);
            if(!d?.ok || !d.models?.['0050'] || !d.models?.['0056'] ||
               !d.models?.['00878'] || !d.models?.['00919'])
              throw Error('Official 4-ETF buy model degraded: '+JSON.stringify(d).slice(0,400));
          }
          console.log('MODEL_PAGE_LATENCY_SMOKE PASS',JSON.stringify({
            validationMs,officialBuyModelMs:buyLatency,
            heavyHistoricalAuto:false}));

          const stockUI = await (await get('/app.js')).text();
          for(const t of ['dividendTimelineMarkup(', 'nextForecast:auto.nextForecast', '下一次配息預估（未計入報酬）', '已除息待入帳'])
            if(!stockUI.includes(t))throw Error('Holdings dividend UI missing '+t);
          const unauth=await fetch(base+'/api/dividend-auto', {signal:AbortSignal.timeout(15000)});
          if(unauth.status!==401)throw Error('Sensitive dividend API authentication changed: '+unauth.status);
          console.log('DIVIDEND_PUBLIC_SMOKE PASS: 4-ETF preview UI shipped; private dividend API requires auth');
          for(const t of ['id="signalAlertsCard"', 'id="signalAlertEnable"', 'id="signalAlertTest"', '/signal-alerts.js'])
            if(!html.includes(t))throw Error('Signal notification UI missing '+t);
          if(html.indexOf('/signal-alerts.js')>=html.indexOf('/app.js?v='))throw Error('Notifier script loads after model');
          const alertScript=await (await get('/signal-alerts.js')).text();
          for(const t of ['observeLayers','observeTrend','requestPermission','Notification','signalAlertToasts'])
            if(!alertScript.includes(t))throw Error('Notifier missing '+t);
          for(const t of ['SignalAlerts?.observeLayers(STATE,lastBuy,lastLive)','SignalAlerts?.observeTrend(d,lastLive)','SignalAlerts?.monitoring()'])
            if(!stockUI.includes(t))throw Error('Model signal hook missing '+t);
          console.log('SIGNAL_ALERT_SMOKE PASS: opt-in desktop notification controls, live model hooks and scripts loaded');

          if(!html.includes('/dip-watch.js'))throw Error('Crash-dip watch module not installed');
          if(!(html.indexOf('/dip-watch.js')<html.indexOf('/app.js?v=')))
             throw Error('Dip-watch module loads after app');
          const dipCode=await(await get('/dip-watch.js')).text();
          for(const t of ['root.DipWatch={observe,evaluate,panel,check}','MAX_AGE_MS','MIN_OBSERVATIONS=4','STABLE_MS=90000','正式A版硬Gate仍FAIL'])
            if(!dipCode.includes(t))throw Error('Crash-dip guard missing: '+t);
          for(const t of ['window.DipWatch?.panel(c,x.r,x.m,','window.DipWatch?.observe(c,lastLive.quotes[c]', '正式模型暫停', '不能記作模型訊號'])
            if(!stockUI.includes(t))throw Error('Crash-dip model/UI separation missing: '+t);
          console.log('CRASH_DIP_SMOKE PASS: four ETF dip watch, hard Gate unchanged, model record blocked while veto');
          for(const text of ["mode:'REBOUND'",'rangeFor(m,px,low,atr)','今日已觸及第','現價已反彈至層間','z.high+Math.max(.15,atr*.4)'])
            if(!dipCode.includes(text))throw Error('Third layer bounce-in-gap repair not live: '+text);
          console.log('DIP_GAP_REBOUND_SMOKE PASS: L3 touched then resumed within bounded rebound tracking range');

          if(!html.includes('id="gateBlockedLedger"') || !html.includes('/gate-blocked-ui.js'))
            throw Error('New blocked-opportunity UI not deployed');
          if(html.indexOf('/gate-blocked-ui.js')>=html.indexOf('/app.js?v='))
            throw Error('Blocked ledger UI loaded after official buy model script');
          if(!stockUI.includes('window.GateBlockedUI?.load(false)'))
            throw Error('Blocked ledger lazy-navigation hook not live');
          const gateUi=await(await get('/gate-blocked-ui.js')).text();
          for(const t of ['gate-blocked-forward','未下單','不影響即時行情與買入模型'])
            if(!gateUi.includes(t))throw Error('Gate blocked UI caution/cache absent: '+t);
          const started=Date.now();
          const report=await(await get('/api/gate-blocked-forward',22000)).json();
          const reportMs=Date.now()-started;
          if(!report.ok || report.storageReady!==true || report.version!=='gate-blocked-forward-v1'||
            !Array.isArray(report.events)||report.events.length>80||!report.limitations)
            throw Error('Persistent blocked opportunity report invalid: '+JSON.stringify(report).slice(0,700));
          for(const code of ['0050','0056','00878','00919']){
            const row=report.summary?.byCode?.[code];
            if(!row || typeof row.events!=='number' || !row.byLayer?.L1 || !row.byLayer?.L2 || !row.byLayer?.L3)
              throw Error('Incomplete per-ETF/layer summary '+code);
            for(const k of [5,20,60]){
              const m=row.byHorizon?.[k];
              if(!m || m.matured>row.events)throw Error('Invalid matured horizon for '+code+' '+k);
            }
          }
          if(reportMs>18000)throw Error('New background report too slow: '+reportMs+'ms');
          const buyDurations=[];
          for(let i=0;i<3;i++){
            const tick=Date.now(),buy=await(await get('/api/buy-model',17000)).json();
            buyDurations.push(Date.now()-tick);
            if(!buy.ok||!buy.models?.['0050']||!buy.models?.['0056']||!buy.models?.['00878']||!buy.models?.['00919'])
              throw Error('Official buy model regressed after blocked-ledger update');
          }
          if(buyDurations.some(x=>x>15000))
            throw Error('Official buy model has unacceptable response latency '+JSON.stringify(buyDurations));
          console.log('GATE_BLOCKED_FORWARD_SMOKE PASS',JSON.stringify({
            asOf:report.asOf,events:report.eventCount,storageReady:report.storageReady,
            reportMs,buyModelMs:buyDurations,scanner:report.scanStatus}));




          for (const t of ['function tradeMarkPrice(t)', 'function modelNetMetrics(t)', "source:'ETF即時行情'", 'priceSource:mark.source']) {
            if (!stockUI.includes(t)) throw Error('Production PnL mark-to-market patch is not live: '+t);
          }
          if(!stockUI.includes('LAST_MODEL_TRADE_MARK_RENDER_AT') || !stockUI.includes('renderModelTrades()'))
            throw Error('Model-trade periodic mark refresh missing');
          const liveQuote=await (await get('/api/etf-live',20000)).json();
          const q=liveQuote.quotes?.['0050'];
          console.log('LIVE_PNL_QUOTE',{price:q?.last,quoteDate:q?.date,serverFetchedAt:q?.serverFetchedAt,source:q?.source,realtime:q?.realtime});
          console.log('TRADE_PNL_SMOKE PASS: latest quote marking, no stale cached-return priority, periodic trade UI update');

          const appChecks=['function tradeMaturedHorizon(t,k)', 'function modelBenchmarkDelta(t,metrics=modelNetMetrics(t))',
            "p.pathBasis!=='post-entry-full-sessions-v1'", 'unknownCount=allMetrics.length-allPnls.length',
            'const jobs=MODEL_TRADES.filter(t=>!t.exitAt).slice().sort'];
          for(const t of appChecks)if(!stockUI.includes(t))throw Error('Performance consistency patch missing: '+t);
          const testPerf=await (await get('/api/trade-performance?code=0050&entryDate=2026-10-13&entryPrice=112.50',55000)).json();
          if(!testPerf.ok)throw Error('Performance API unhealthy: '+JSON.stringify(testPerf).slice(0,400));
          if(![null,'post-entry-full-sessions-v1'].includes(testPerf.pathBasis??null))
            throw Error('Wrong performance path basis '+testPerf.pathBasis);
          for(const k of [5,20,60]){
            const h=testPerf.horizon?.[k];
            if(h&&(!h.date||h.date<='2026-10-13'))throw Error('Invalid '+k+'d maturity '+JSON.stringify(h));
          }
          const mae=testPerf.maePct,mfe=testPerf.mfePct;
          if(mae!=null&&mae>0.000001)throw Error('MAE must not be positive '+mae);
          if(mfe!=null&&mfe<-.000001)throw Error('MFE must not be negative '+mfe);
          console.log('FULL_PERFORMANCE_SMOKE PASS',JSON.stringify({
             pathBasis:testPerf.pathBasis,pathSamples:testPerf.pathSamples,
             quoteSource:testPerf.currentPriceSource,mae,mfe,maturedHorizonKeys:[5,20,60].filter(k=>testPerf.horizon?.[k])
          }));



          if(!html.includes('id="crashGateResearchResult"') || !html.includes('/crash-gate-lab-ui.js'))throw Error('Crash Gate research UI not deployed');
          if(!stockUI.includes('window.CrashGateLabUI?.auditSnippet') || !stockUI.includes('window.CrashGateLabUI?.load(false)'))throw Error('Crash Gate study UI hooks not deployed');
          const labModule=await (await get('/crash-gate-lab-ui.js')).text();
          if(!labModule.includes('no-lookahead')&&!labModule.includes('次一交易日開盤'))throw Error('Lab research caution missing');
          const study=await (await get('/api/crash-gate-lab',55000)).json();
          if(!study.ok || !study.warning || !study.marketProxy)throw Error('Crash Gate research API unavailable: '+JSON.stringify(study).slice(0,500));
          const rows=[];
          for(const code of ['0050','0056','00878','00919']){
            const r=study.results?.[code];
            if(!r)throw Error('Crash Gate study missing ETF '+code);
            if(r.ok){
              if(!(r.summary?.events>=0)||r.summary.eligible>r.summary.events||!r.methodology?.limitations)
                throw Error('Invalid historical cohort or limitations for '+code);
              const sample={code,events:r.summary.events,eligible:r.summary.eligible,source:r.source,
               official:r.historyOfficial,proxyOfficial:r.proxyOfficial,horizons:{}};
              for(const h of [5,20,60]){
                const r0=r.summary.results[h];
                if(!r0 || r0.unfiltered.matured>r.summary.events || r0.reboundQualified.matured>r.summary.eligible)
                  throw Error('Invalid horizon '+code+' '+h);
                sample.horizons[h]={all:r0.unfiltered,filtered:r0.reboundQualified};
              }
              rows.push(sample);
            }else rows.push({code,status:r.status,error:r.error});
          }
          console.log('CRASH_GATE_RESEARCH_SMOKE PASS',JSON.stringify({date:study.asOfDate,proxy:study.marketProxy,rows}));

          const buyModelAudit=await(await get('/api/buy-model',45000)).json();
          if(!buyModelAudit.ok)throw Error('Official buy model API unavailable during research audit: '+JSON.stringify(buyModelAudit).slice(0,420));
          const audits=[];
          for(const code of ['0050','0056','00878','00919']){
            const audit=buyModelAudit.researchGateAudit?.[code],m=buyModelAudit.models?.[code];
            if(!audit || !Array.isArray(audit.flags) || audit.flags.length!==4)
              throw Error('No live Gate audit for '+code);
            if(!m || !Object.prototype.hasOwnProperty.call(m,'hardVeto'))
              throw Error('Official A model missing for '+code);
            audits.push({code,score:m.score,officialVeto:m.hardVeto,reason:m.hardVetoReason,
              oldCount:audit.existing.flagCount,independentCount:audit.independent.flagCount,
              doubleCountRisk:audit.doubleCountRisk,evidenceComplete:audit.evidenceComplete,
              hits:audit.flags.filter(f=>f.hit).map(f=>f.id)});
          }
          console.log('CRASH_GATE_LIVE_AUDIT PASS',JSON.stringify({
             fetchedAt:buyModelAudit.fetchedAt,dataFresh:buyModelAudit.dataFresh,audits}));


          const state = await (await get('/api/model-sync/status')).json();
          if (!state.supabaseConfigured) throw Error('Supabase not configured: persistent forward ledger unavailable');
          const forward = await (await get('/api/trend-ab-forward', 55000)).json();
          if (!forward.ok || forward.storageReady!==true || !Array.isArray(forward.events) || !forward.summary)
            throw Error('Forward ledger invalid: '+JSON.stringify(forward).slice(0,450));
          if (!forward.version || !forward.version.startsWith('trend-forward-ledger'))
            throw Error('Incorrect forward ledger version');
          if (typeof forward.eventCount!=='number' || forward.eventCount<0)
            throw Error('Invalid forward event count');
          console.log('FORWARD_LEDGER',JSON.stringify({storageReady:forward.storageReady,
            eventCount:forward.eventCount,version:forward.version,lastScanAt:forward.lastScanAt,
            asOf:forward.asOf,source:forward.source,summary:forward.summary.events}));
          const ledgerUI=await (await get('/trend-forward-ui.js')).text();
          if(!ledgerUI.includes('trendForwardLedger'))throw Error('Forward UI script not deployed');

          let result = null, err = null;
          for (let attempt=1;attempt<=3;attempt++) {
            try {
              const d = await (await get('/api/trend-entry', 65000)).json();
              if (!d.ok || !d.models) throw Error('Invalid trend API: '+JSON.stringify(d).slice(0,250));
              let valid=0;
              for (const code of ['0050','0056','00878','00919']) {
                const x=d.models[code];
                if (!x || typeof x.ok !== 'boolean') throw Error(code+' missing model');
                if (!x.ok) { console.log(code, 'NOT_READY', String(x.error||'')); continue; }
                if (!x.shadowB || !x.abPriceCore) throw Error(code+' missing B or A/B replay');
                if (x.shadowB.mode !== 'SHADOW_ONLY') throw Error(code+' shadow writes official data?');
                valid++;
                const ab=x.abPriceCore;
                console.log('RESULT',JSON.stringify({code,official:x.status,shadowB:x.shadowB.status,ready:ab.ready,
                  aSignals:ab.all?.A?.signals??null,bSignals:ab.all?.B?.signals??null,
                  a20:ab.all?.A?.period?.[20]?.avgNetPct??null,b20:ab.all?.B?.period?.[20]?.avgNetPct??null,
                  lastDate:ab.lastDate,error:ab.error||null}));
              }
              if (!valid) throw Error('all four models unavailable');
              result={valid}; break;
            } catch (e) {
              err=e; console.log('RETRY',attempt,String(e));
              if (attempt<3) await wait(35000);
            }
          }
          if (!result) throw err;

          // 2026-10-14 read-only check for whether the 00919 official A strong-add signal was actually observed.
          const now = new Date().toISOString();
          const feed = await (await get('/api/trend-ab-forward', 55000)).json();
          const todayRows = (feed.events||[]).filter(e=>String(e.code)==='00919'&&String(e.signalDate||e.firstObservedAt||'').startsWith('2026-10-14'));
          console.log('CHECK_00919_FORWARD', JSON.stringify({
             observedAt:now,asOf:feed.asOf,scanStatus:feed.scanStatus,lastScanAt:feed.lastScanAt,
             eventCount:feed.eventCount,all00919:(feed.events||[]).filter(e=>e.code==='00919').length,
             todayRows:todayRows.map(e=>({code:e.code,signalDate:e.signalDate,firstObservedAt:e.firstObservedAt,
               firstPrice:e.firstPrice,entryPrice:e.entryPrice,a:e.a,b:e.b,modelStatus:e.modelStatus}))
          }));
          const market = await (await get('/api/trend-entry', 65000)).json();
          const m = market.models?.['00919'];
          console.log('CHECK_00919_CURRENT', JSON.stringify({at:market.fetchedAt,ok:m?.ok,
            status:m?.status,statusText:m?.statusText,score:m?.score,price:m?.price,
            action:m?.action,levels:m?.levels,shadowB:m?.shadowB?.status,error:m?.error}));

          console.log('PRODUCTION SMOKE PASS',JSON.stringify(result));
          NODE
