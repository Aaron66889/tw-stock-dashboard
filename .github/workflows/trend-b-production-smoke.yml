name: Production strong-add B smoke probe
on:
  push:
    branches:
      - verify/trend-b-production-smoke-20261013
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live website HTML and API
        run: |
          node <<'NODE'
          const base = 'https://tw-stock-dashboard-5.onrender.com';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function get(path, timeout = 55000) {
            const r = await fetch(base + path, { signal: AbortSignal.timeout(timeout), headers: { Accept: '*/*' } });
            if (!r.ok) throw Error(path + ' HTTP ' + r.status);
            return r;
          }
          const health = await (await get('/api/health')).json();
          if (!health.ok) throw Error('health not ok: ' + JSON.stringify(health));
          console.log('HEALTH', JSON.stringify({ok:health.ok,build:health.build,status:health.status}));
          const html = await (await get('/')).text();
          for (const v of ['id="trendShadowB"', '/trend-shadow-b-ui.js', '/model-ab.js']) {
            if (!html.includes(v)) throw Error('HTML missing ' + v);
          }
          const script = await (await get('/trend-shadow-b-ui.js')).text();
          if (!script.includes('Shadow') || !script.includes('abPriceCore')) throw Error('frontend code not deployed');
          console.log('HTML and frontend script: PASS');
          let result = null, err = null;
          for (let attempt=1;attempt<=3;attempt++) {
            try {
              const d = await (await get('/api/trend-entry', 65000)).json();
              if (!d.ok || !d.models) throw Error('Invalid trend API: '+JSON.stringify(d).slice(0,250));
              let valid=0;
              for (const code of ['0050','0056','00878','00919']) {
                const x=d.models[code];
                if (!x || typeof x.ok !== 'boolean') throw Error(code+' missing model');
                if (!x.ok) { console.log(code, 'NOT_READY', String(x.error||'')); continue; }
                if (!x.shadowB || !x.abPriceCore) throw Error(code+' missing B or A/B replay');
                if (x.shadowB.mode !== 'SHADOW_ONLY') throw Error(code+' shadow writes official data?');
                valid++;
                const ab=x.abPriceCore;
                console.log('RESULT',JSON.stringify({code,official:x.status,shadowB:x.shadowB.status,ready:ab.ready,
                  aSignals:ab.all?.A?.signals??null,bSignals:ab.all?.B?.signals??null,
                  a20:ab.all?.A?.period?.[20]?.avgNetPct??null,b20:ab.all?.B?.period?.[20]?.avgNetPct??null,
                  lastDate:ab.lastDate,error:ab.error||null}));
              }
              if (!valid) throw Error('all four models unavailable');
              result={valid}; break;
            } catch (e) {
              err=e; console.log('RETRY',attempt,String(e));
              if (attempt<3) await wait(35000);
            }
          }
          if (!result) throw err;
          console.log('PRODUCTION SMOKE PASS',JSON.stringify(result));
          NODE
