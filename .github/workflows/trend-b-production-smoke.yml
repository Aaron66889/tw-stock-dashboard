name: Production strong-add B smoke probe
on:
  push:
    branches:
      - verify/trend-b-production-smoke-20261013
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live website HTML and API
        run: |
          node <<'NODE'
          const base = 'https://tw-stock-dashboard-5.onrender.com';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function get(path, timeout = 55000) {
            const r = await fetch(base + path, { signal: AbortSignal.timeout(timeout), headers: { Accept: '*/*' } });
            if (!r.ok) throw Error(path + ' HTTP ' + r.status);
            return r;
          }
          const health = await (await get('/api/health')).json();
          if (!health.ok) throw Error('health not ok: ' + JSON.stringify(health));
          console.log('HEALTH', JSON.stringify({ok:health.ok,build:health.build,status:health.status}));
          const html = await (await get('/')).text();
          for (const v of ['id="trendShadowB"', '/trend-shadow-b-ui.js', '/model-ab.js', 'id="trendForwardLedger"','/trend-forward-ui.js']) {
            if (!html.includes(v)) throw Error('HTML missing ' + v);
          }
          const script = await (await get('/trend-shadow-b-ui.js')).text();
          if (!script.includes('Shadow') || !script.includes('abPriceCore')) throw Error('frontend code not deployed');
          console.log('HTML and frontend script: PASS');
          const stockUI = await (await get('/app.js')).text();
          for(const t of ['dividendTimelineMarkup(', 'nextForecast:auto.nextForecast', '下一次配息預估（未計入報酬）', '已除息待入帳'])
            if(!stockUI.includes(t))throw Error('Holdings dividend UI missing '+t);
          const unauth=await fetch(base+'/api/dividend-auto', {signal:AbortSignal.timeout(15000)});
          if(unauth.status!==401)throw Error('Sensitive dividend API authentication changed: '+unauth.status);
          console.log('DIVIDEND_PUBLIC_SMOKE PASS: 4-ETF preview UI shipped; private dividend API requires auth');
          const state = await (await get('/api/model-sync/status')).json();
          if (!state.supabaseConfigured) throw Error('Supabase not configured: persistent forward ledger unavailable');
          const forward = await (await get('/api/trend-ab-forward', 55000)).json();
          if (!forward.ok || forward.storageReady!==true || !Array.isArray(forward.events) || !forward.summary)
            throw Error('Forward ledger invalid: '+JSON.stringify(forward).slice(0,450));
          if (!forward.version || !forward.version.startsWith('trend-forward-ledger'))
            throw Error('Incorrect forward ledger version');
          if (typeof forward.eventCount!=='number' || forward.eventCount<0)
            throw Error('Invalid forward event count');
          console.log('FORWARD_LEDGER',JSON.stringify({storageReady:forward.storageReady,
            eventCount:forward.eventCount,version:forward.version,lastScanAt:forward.lastScanAt,
            asOf:forward.asOf,source:forward.source,summary:forward.summary.events}));
          const ledgerUI=await (await get('/trend-forward-ui.js')).text();
          if(!ledgerUI.includes('trendForwardLedger'))throw Error('Forward UI script not deployed');

          let result = null, err = null;
          for (let attempt=1;attempt<=3;attempt++) {
            try {
              const d = await (await get('/api/trend-entry', 65000)).json();
              if (!d.ok || !d.models) throw Error('Invalid trend API: '+JSON.stringify(d).slice(0,250));
              let valid=0;
              for (const code of ['0050','0056','00878','00919']) {
                const x=d.models[code];
                if (!x || typeof x.ok !== 'boolean') throw Error(code+' missing model');
                if (!x.ok) { console.log(code, 'NOT_READY', String(x.error||'')); continue; }
                if (!x.shadowB || !x.abPriceCore) throw Error(code+' missing B or A/B replay');
                if (x.shadowB.mode !== 'SHADOW_ONLY') throw Error(code+' shadow writes official data?');
                valid++;
                const ab=x.abPriceCore;
                console.log('RESULT',JSON.stringify({code,official:x.status,shadowB:x.shadowB.status,ready:ab.ready,
                  aSignals:ab.all?.A?.signals??null,bSignals:ab.all?.B?.signals??null,
                  a20:ab.all?.A?.period?.[20]?.avgNetPct??null,b20:ab.all?.B?.period?.[20]?.avgNetPct??null,
                  lastDate:ab.lastDate,error:ab.error||null}));
              }
              if (!valid) throw Error('all four models unavailable');
              result={valid}; break;
            } catch (e) {
              err=e; console.log('RETRY',attempt,String(e));
              if (attempt<3) await wait(35000);
            }
          }
          if (!result) throw err;

          // 2026-10-14 read-only check for whether the 00919 official A strong-add signal was actually observed.
          const now = new Date().toISOString();
          const feed = await (await get('/api/trend-ab-forward', 55000)).json();
          const todayRows = (feed.events||[]).filter(e=>String(e.code)==='00919'&&String(e.signalDate||e.firstObservedAt||'').startsWith('2026-10-14'));
          console.log('CHECK_00919_FORWARD', JSON.stringify({
             observedAt:now,asOf:feed.asOf,scanStatus:feed.scanStatus,lastScanAt:feed.lastScanAt,
             eventCount:feed.eventCount,all00919:(feed.events||[]).filter(e=>e.code==='00919').length,
             todayRows:todayRows.map(e=>({code:e.code,signalDate:e.signalDate,firstObservedAt:e.firstObservedAt,
               firstPrice:e.firstPrice,entryPrice:e.entryPrice,a:e.a,b:e.b,modelStatus:e.modelStatus}))
          }));
          const market = await (await get('/api/trend-entry', 65000)).json();
          const m = market.models?.['00919'];
          console.log('CHECK_00919_CURRENT', JSON.stringify({at:market.fetchedAt,ok:m?.ok,
            status:m?.status,statusText:m?.statusText,score:m?.score,price:m?.price,
            action:m?.action,levels:m?.levels,shadowB:m?.shadowB?.status,error:m?.error}));

          console.log('PRODUCTION SMOKE PASS',JSON.stringify(result));
          NODE
