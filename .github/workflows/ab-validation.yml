name: AB validation safety checks
on:
  push:
    branches:
      - feature/ab-performance-validation-20261013
      - fix/trend-b-advisory-20261013
      - feature/trend-ab-forward-ledger-20261013
      - fix/four-etf-dividend-forecast-20261014
      - feature/desktop-signal-alerts-20261014
      - fix/trade-pnl-live-quote-20261015
      - fix/performance-consistency-20261015
      - feature/crash-dip-watch-20261015
      - feature/crash-gate-research-20261015
  pull_request:
    paths:
      - 'public/model-ab.js'
      - 'public/index.html'
      - 'public/app.js'
      - 'public/signal-alerts.js'
      - 'public/dip-watch.js'
      - 'tests/dip-watch.test.js'
      - 'crash-gate-lab.js'
      - 'public/crash-gate-lab-ui.js'
      - 'tests/crash-gate-lab.test.js'
      - 'tests/signal-alerts.test.js'
      - 'tests/reliability.test.js'
      - 'tests/model-ab.test.js'
      - 'trend-shadow-b.js'
      - 'trend-forward-ledger.js'
      - 'public/trend-forward-ui.js'
      - 'tests/trend-forward-ledger.test.js'
      - 'server.js'
      - 'public/trend-shadow-b-ui.js'
      - 'tests/trend-shadow-b.test.js'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check && node --check public/signal-alerts.js && node --check public/dip-watch.js && node --check crash-gate-lab.js && node --check public/crash-gate-lab-ui.js
      - run: node --check trend-shadow-b.js && node --check public/trend-shadow-b-ui.js && node --check trend-forward-ledger.js && node --check public/trend-forward-ui.js
      - run: npm test
