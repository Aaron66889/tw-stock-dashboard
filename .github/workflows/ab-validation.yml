name: AB validation safety checks
on:
  push:
    branches:
      - feature/ab-performance-validation-20261013
  pull_request:
    paths:
      - 'public/model-ab.js'
      - 'public/index.html'
      - 'tests/model-ab.test.js'
      - 'trend-shadow-b.js'
      - 'public/trend-shadow-b-ui.js'
      - 'tests/trend-shadow-b.test.js'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: node --check trend-shadow-b.js && node --check public/trend-shadow-b-ui.js
      - run: npm test
